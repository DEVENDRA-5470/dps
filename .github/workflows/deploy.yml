name: Deploy Student Dashboard to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          set -e

          echo "Checking required files..."

          test -f dashboard.html
          test -d students

          echo "dashboard.html found"
          echo "students directory found"
          echo "Validation successful"

      - name: Create deployment package
        run: |
          set -e

          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf /tmp/deployment.tar.gz .

          echo "Deployment package created"
          ls -lh /tmp/deployment.tar.gz

      - name: Upload package to Azure VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: azureuser
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "/tmp/deployment.tar.gz"
          target: "/tmp"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: azureuser
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            sudo mkdir -p /var/www/student-dashboard

            sudo rm -rf /var/www/student-dashboard/*

            sudo tar \
              -xzf /tmp/deployment.tar.gz \
              -C /var/www/student-dashboard

            sudo chown -R www-data:www-data \
              /var/www/student-dashboard

            sudo find /var/www/student-dashboard \
              -type d -exec chmod 755 {} \;

            sudo find /var/www/student-dashboard \
              -type f -exec chmod 644 {} \;

            rm -f /tmp/deployment.tar.gz

            sudo nginx -t

            sudo systemctl reload nginx

            echo "Deployment successful!"
